[project]
name = "ask-the-hole"
version = "0.1.0"
description = "Natural-language questions over AGS 4.x geotechnical data, fully offline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "python-ags4>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
ask-the-hole = "ask_the_hole.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_the_hole"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
# ANN401 bans `Any`, but Pydantic "before" validators legitimately receive
# whatever was in the file, which is genuinely Any until validation runs.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
